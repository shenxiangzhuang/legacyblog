[project]
name = "legacy-blog"
version = "0.1.0"
description = "Xiangzhuang Shen's Blog"
authors = [
    {name = "Xiangzhuang Shen", email = "datahonor@gmail.com"},
]
license = {text = "CC-BY-SA-4.0"}
readme = "README.md"
requires-python = ">= 3.10"
dependencies = []


[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-material-extensions",
    "mkdocstrings",
    "mkdocs-bibtex",
    "mkdocstrings-python",
    "mkdocs-autorefs",
    "mkdocs-git-committers-plugin-2",
    "mkdocs-git-revision-date-localized-plugin",


    "pre-commit",
    "mkdocstrings",
    "mkdocs-minify-plugin",
    "neoteroi-mkdocs",
    "mkdocs-pdf",
]


[tool.isort]
profile = "black"
